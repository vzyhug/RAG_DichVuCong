### Qwen2.5-7B-Instruct SFT with LoRA/QLoRA through LLaMA-Factory.
### Run from the repository root with: llamafactory-cli train training/configs/sft_qwen_lora.yaml

### model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset: sft_dataset_sharegpt
dataset_dir: training/data
template: qwen
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 2
packing: false

### output and checkpoint strategy
output_dir: training/outputs/qwen2.5-7b-instruct-qlora
overwrite_output_dir: false
logging_steps: 10
save_strategy: steps
save_steps: 100
save_total_limit: 2
plot_loss: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.0002
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
seed: 42
gradient_checkpointing: true

### precision
bf16: true
fp16: false

### QLoRA: keep these values for 4-bit training on a CUDA Linux environment.
quantization_bit: 4
quantization_method: bitsandbytes
double_quantization: true
optim: paged_adamw_8bit

### For ordinary LoRA instead of QLoRA, remove the four QLoRA keys above and use
### a CUDA-compatible optimizer such as optim: adamw_torch.

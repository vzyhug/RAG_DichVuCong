### DPO continuation from the SFT LoRA adapter.
### Run from the repository root with:
### llamafactory-cli train training/configs/dpo_qwen_lora.yaml

### model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
adapter_name_or_path: training/outputs/qwen2.5-7b-instruct-qlora
create_new_adapter: true
trust_remote_code: true

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
pref_beta: 0.1
pref_loss: sigmoid

### dataset
dataset: preference_dataset
dataset_dir: training/data
cutoff_len: 2048
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output and checkpoint strategy
output_dir: training/outputs/qwen2.5-7b-instruct-dpo-lora
overwrite_output_dir: false
logging_steps: 10
save_strategy: steps
save_steps: 100
save_total_limit: 2
plot_loss: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.00005
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
seed: 42
gradient_checkpointing: true
resume_from_checkpoint: null

### precision and QLoRA
bf16: true
fp16: false
quantization_bit: 4
quantization_method: bitsandbytes
double_quantization: true
optim: paged_adamw_8bit
